# Public Bonya REST API: the surface offered by the CLI and the web console.
# Charges (top-ups, coupons, invoices, payments, plans) and operator/admin
# endpoints are intentionally not part of this contract.
openapi: 3.1.0
info:
  title: Bonya Compute REST API
  version: 0.1.0
  description: >
    Public REST and WebSocket surface on TApi behind Caddy. Non-2xx responses
    are RFC 9457 application/problem+json with a stable machine-readable code.
    WebSocket endpoints are HTTP GET upgrades; their options travel in the
    START frame, never in query strings.
servers:
  - url: https://api.bonya.ai
    description: Production
security:
  - personalApiKey: []
  - supabaseJwt: []
tags:
  - name: Sandboxes
    description: Create, look up, list, pause, fork, snapshot, and delete sandboxes.
  - name: Snapshots
    description: Named point-in-time copies of a sandbox that new sandboxes can start from.
  - name: Templates
    description: Saved, versioned launch configurations for sandboxes.
  - name: Registry Connections
    description: Credentials for pulling private container images.
  - name: Secrets
    description: Write-only secrets and secret sets injected into sandboxes and jobs.
  - name: Previews
    description: Expose a sandbox port as an HTTPS URL.
  - name: Exec
    description: Run a command in a sandbox, buffered or over a TTY.
  - name: Sessions
    description: Named, persistent command sessions that outlive a connection.
  - name: Filesystem
    description: Read, write, and manage files inside a sandbox.
  - name: Jobs
    description: Managed, tracked runs of a command or script.
  - name: Job Schedules
    description: Cron, interval, or one-shot timing wrapped around a job.
  - name: Organizations
    description: Organization membership, administration and usage reporting.
  - name: Invitations
    description: Invite members to an organization and accept invitations.
  - name: API Keys
    description: Personal API key management.
  - name: Device Login
    description: Browser-based login for the CLI.
paths:
  /v1/templates:
    get:
      operationId: listTemplates
      tags: [Templates]
      summary: List templates
      description: The organization's templates, each at its latest revision.
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTemplate
      tags: [Templates]
      summary: Create a template
      description: >-
        Validates the configuration, resolves the image to a digest, and
        publishes revision 1.
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/TemplateID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: getTemplate
      tags: [Templates]
      summary: Get a template
      parameters:
        - name: revision
          in: query
          description: A specific revision. Defaults to the latest.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateTemplate
      tags: [Templates]
      summary: Update a template
      description: >-
        Omitted fields keep their current value. Changing the configuration
        publishes a new immutable revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteTemplate
      tags: [Templates]
      summary: Delete a template
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /v1/registry-connections:
    get:
      operationId: listRegistryConnections
      tags: [Registry Connections]
      summary: List registry connections
      description: Stored credentials for pulling private container images. Passwords are never returned.
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                required: [registry_connections]
                properties:
                  registry_connections:
                    type: array
                    items: { $ref: '#/components/schemas/RegistryConnection' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRegistryConnection
      tags: [Registry Connections]
      summary: Create a registry connection
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistryConnectionWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryConnection' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/registry-connections/{connection_id}:
    parameters:
      - $ref: '#/components/parameters/RegistryConnectionID'
      - $ref: '#/components/parameters/OrganizationHeader'
    patch:
      operationId: updateRegistryConnection
      tags: [Registry Connections]
      summary: Update a registry connection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistryConnectionWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryConnection' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteRegistryConnection
      tags: [Registry Connections]
      summary: Delete a registry connection
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /v1/registry-connections/{connection_id}/validate:
    post:
      operationId: validateRegistryConnection
      tags: [Registry Connections]
      summary: Validate a registry connection
      description: Resolves an image through the connection and returns its digest.
      parameters:
        - $ref: '#/components/parameters/RegistryConnectionID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image: { type: string }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                required: [image_digest]
                properties:
                  image_digest: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /v1/secrets:
    get:
      operationId: listSecrets
      tags: [Secrets]
      summary: List secrets
      description: Write-only secrets. Names and timestamps are returned, never values.
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: Secrets
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: array
                    items: { $ref: '#/components/schemas/Secret' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSecret
      tags: [Secrets]
      summary: Create a secret
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/secrets/{secret_id}:
    parameters:
      - $ref: '#/components/parameters/SecretID'
      - $ref: '#/components/parameters/OrganizationHeader'
    patch:
      operationId: updateSecret
      tags: [Secrets]
      summary: Update a secret
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSecret
      tags: [Secrets]
      summary: Delete a secret
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /v1/secret-sets:
    get:
      operationId: listSecretSets
      tags: [Secrets]
      summary: List secret sets
      description: >-
        Named groups of environment variables injected into sandboxes and
        jobs via secret_sets. Key names are returned, never values.
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: Secret sets
          content:
            application/json:
              schema:
                type: object
                required: [secret_sets]
                properties:
                  secret_sets:
                    type: array
                    items: { $ref: '#/components/schemas/SecretSet' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSecretSet
      tags: [Secrets]
      summary: Create a secret set
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretSetWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretSet' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/secret-sets/{secret_set_id}:
    parameters:
      - $ref: '#/components/parameters/SecretSetID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: getSecretSet
      tags: [Secrets]
      summary: Get a secret set
      responses:
        '200':
          description: Secret set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretSet' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSecretSet
      tags: [Secrets]
      summary: Update a secret set
      description: Publishes a new revision. Pass the current revision to guard against concurrent edits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretSetWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretSet' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSecretSet
      tags: [Secrets]
      summary: Delete a secret set
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox:
    get:
      operationId: listSandboxes
      tags: [Sandboxes]
      summary: List sandboxes
      description: >-
        Paginated with page_size/page_token, optionally filtered by states.
        Deleted sandboxes are not listed.
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: page_token
          in: query
          schema: { type: string }
        - name: states
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/SandboxState' }
          style: form
          explode: true
        - name: include_disposable
          in: query
          description: Include disposable (job-created) sandboxes.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Sandbox page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSandbox
      tags: [Sandboxes]
      summary: Create a sandbox
      description: >-
        Returns 202 Accepted immediately by default; pass ?wait=ready to
        block until the sandbox is ready, which returns 201 Created instead.
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: wait
          in: query
          schema: { type: string, enum: [ready] }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxCreate' }
      responses:
        '201':
          description: Created and ready (wait=ready)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/gpu-options:
    get:
      operationId: listGpuOptions
      tags: [Sandboxes]
      summary: List GPU options
      description: The GPU type and count combinations a sandbox can be created with.
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema:
                type: object
                required: [gpu_options]
                properties:
                  gpu_options:
                    type: array
                    items: { $ref: '#/components/schemas/GpuRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: getSandbox
      tags: [Sandboxes]
      summary: Get a sandbox
      responses:
        '200':
          description: Sandbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSandbox
      tags: [Sandboxes]
      summary: Delete a sandbox
      description: >-
        Synchronous teardown. Returns the sandbox in its final state. An
        unknown or cross-org sandbox_id returns 404; a sandbox in a state that
        cannot be deleted right now (for example waking) returns 409.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/pause:
    post:
      operationId: pauseSandbox
      tags: [Sandboxes]
      summary: Pause a sandbox
      description: >-
        Forces a pause and answers when the requested stage is reached. warm
        resumes fastest; cold frees more resources. A paused sandbox wakes on
        keepalive, on exec or file access, or on incoming traffic.
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stage]
              properties:
                stage: { type: string, enum: [warm, cold] }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/keepalive:
    post:
      operationId: keepaliveSandbox
      tags: [Sandboxes]
      summary: Hold a sandbox awake
      description: >-
        Places an expiring keep-awake hold. A paused sandbox is woken. Returns
        503 with Retry-After while the wake is in progress.
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [for]
              properties:
                for:
                  type: string
                  description: Hold duration as a Go duration, for example 30m or 2h.
      responses:
        '200':
          description: Hold placed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sandbox'
                  - type: object
                    required: [keepalive_until]
                    properties:
                      keepalive_until: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/capability:
    post:
      operationId: mintSandboxCapability
      tags: [Sandboxes]
      summary: Mint an exec capability
      description: >-
        Issues a fresh exec capability token for a sandbox whose earlier token
        has expired. Existing unexpired tokens stay valid.
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: Capability
          content:
            application/json:
              schema:
                type: object
                required: [capability_jws, expires_at, authority_generation]
                properties:
                  capability_jws: { type: string }
                  expires_at: { type: string, format: date-time }
                  authority_generation: { type: integer }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/network:
    patch:
      operationId: updateSandboxNetwork
      tags: [Sandboxes]
      summary: Replace the network policy
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkPolicy' }
      responses:
        '200':
          description: Updated sandbox (see network_revision and network_applied_revision)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fork:
    post:
      operationId: forkSandbox
      tags: [Sandboxes]
      summary: Fork a sandbox
      description: >-
        Creates count new sandboxes with the source's memory and disk, on the
        source's node. 201 when every child is running, 200 when some failed
        (see each child's state), 202 on a repeat whose first fork is still
        running.
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count]
              properties:
                count: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/ForkResult' }
        '201': { $ref: '#/components/responses/ForkResult' }
        '202': { $ref: '#/components/responses/ForkResult' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/snapshots:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: listSnapshots
      tags: [Snapshots]
      summary: List a sandbox's snapshots
      responses:
        '200':
          description: Snapshots
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { $ref: '#/components/schemas/Snapshot' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSnapshot
      tags: [Snapshots]
      summary: Create a named snapshot
      description: 201 once published; 202 on a repeat whose first write is still running.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '202':
          description: In progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/snapshot/{snapshot_id}:
    parameters:
      - name: snapshot_id
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: getSnapshot
      tags: [Snapshots]
      summary: Get a snapshot
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSnapshot
      tags: [Snapshots]
      summary: Delete a snapshot
      responses:
        '200':
          description: Deleted snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/previews:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: listPreviews
      tags: [Previews]
      summary: List preview URLs
      description: List preview URLs for a sandbox. Never returns capabilities.
      responses:
        '200':
          description: Preview list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewListResponse' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPreview
      tags: [Previews]
      summary: Create a preview URL
      description: >-
        Returns the preview. A private preview also returns a grant whose
        token is shown only on this response; 201 for a new preview, 200 when
        the Idempotency-Key repeats an earlier create.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewCreateRequest' }
      responses:
        '200':
          description: Existing preview (repeat of an earlier create)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewCreateResponse' }
        '201':
          description: Preview created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewCreateResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/previews/{preview_id}:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/PreviewID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: getPreview
      tags: [Previews]
      summary: Get a preview URL
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preview' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deletePreview
      tags: [Previews]
      summary: Delete a preview URL
      description: Returns the deleted preview.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preview' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/previews/{preview_id}/grants:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/PreviewID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: listPreviewGrants
      tags: [Previews]
      summary: List access grants
      responses:
        '200':
          description: Grants (tokens are never returned here)
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items: { $ref: '#/components/schemas/PreviewGrant' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPreviewGrant
      tags: [Previews]
      summary: Create an access grant
      description: The token and exchange_url are shown only on this response.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewGrantRequest' }
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrant' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/previews/{preview_id}/grants/{grant_id}:
    delete:
      operationId: revokePreviewGrant
      tags: [Previews]
      summary: Revoke an access grant
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/PreviewID'
        - name: grant_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: Revoked grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrant' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/previews/{preview_id}/grants/{grant_id}/renew:
    post:
      operationId: renewPreviewGrant
      tags: [Previews]
      summary: Renew an access grant
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/PreviewID'
        - name: grant_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewGrantRequest' }
      responses:
        '200':
          description: Renewed grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrant' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/exec:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    post:
      operationId: execDirect
      tags: [Exec]
      summary: Run a command (buffered)
      description: Synchronous, non-TTY exec — JSON body in, JSON body out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectExecRequest' }
      responses:
        '200':
          description: Exec finished (exit state in body)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectExecResponse' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: execTTY
      tags: [Exec]
      summary: Run a command (TTY)
      description: >-
        A transient, interactive TTY session over a WebSocket upgrade. The
        START frame carries a TTYStartRequest.
      responses:
        '101': { description: Switching protocols; admission happens at START }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List sessions
      description: >-
        Never wakes a suspended sandbox — it answers from the suspend-time
        snapshot instead.
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Create a session
      description: >-
        Keyed by name. Creating over a live session returns 409
        session_exists; replace only applies to a terminal (already-exited)
        session, never a running or attached one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/sessions/{session_name}/attach:
    get:
      operationId: attachSession
      tags: [Sessions]
      summary: Attach to a session
      description: >-
        A WebSocket upgrade. The START frame carries an AttachStartRequest.
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/SessionName'
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '101': { description: Switching protocols; admission happens at START }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/sessions/{session_name}/kill:
    post:
      operationId: killSession
      tags: [Sessions]
      summary: Kill a session
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/SessionName'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionKillRequest' }
      responses:
        '200':
          description: Signal delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/read:
    get:
      operationId: fsRead
      tags: [Filesystem]
      summary: Read a file
      description: Returns the raw file contents as application/octet-stream.
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream: {}
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/write:
    put:
      operationId: fsWrite
      tags: [Filesystem]
      summary: Write a file
      description: The request body is the raw file contents as application/octet-stream.
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        '204': { description: Written }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/list:
    get:
      operationId: fsList
      tags: [Filesystem]
      summary: List a directory
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsListResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/stat:
    get:
      operationId: fsStat
      tags: [Filesystem]
      summary: Get file metadata
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsStatResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/mkdir:
    post:
      operationId: fsMkdir
      tags: [Filesystem]
      summary: Create a directory
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsMkdirRequest' }
      responses:
        '201': { description: Directory created }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/rename:
    post:
      operationId: fsRename
      tags: [Filesystem]
      summary: Rename or move a file
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsRenameRequest' }
      responses:
        '200': { description: Renamed }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs:
    delete:
      operationId: fsDelete
      tags: [Filesystem]
      summary: Delete a file or directory
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
        - name: recursive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  # Workflows (durable jobs). Member-authenticated like the sandbox surface
  # above, not JWT-only like organization administration below: any member
  # who can run a command interactively can run the same command as a job.
  /v1/job:
    parameters:
      - $ref: '#/components/parameters/OrganizationHeader'
    post:
      operationId: createJob
      tags: [Jobs]
      summary: Create a job
      description: >-
        Run or start a job on a new or existing sandbox. wait=false (default)
        starts durably and returns run_id immediately; wait=true blocks for
        the result, bounded by the caller's own request timeout.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      responses:
        '200':
          description: wait=true and the run finished before the request timed out
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/JobRun' }
        '202':
          description: wait=false; the run was durably accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStartResponse' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listJobRuns
      tags: [Jobs]
      summary: List job runs
      description: >-
        A tenant's runs, newest first, optionally filtered to sandbox_id or
        schedule_id.
      parameters:
        - name: sandbox_id
          in: query
          schema: { type: string }
        - name: schedule_id
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Run page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRunPage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/job/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: getJobRun
      tags: [Jobs]
      summary: Get a job run
      description: >-
        Full run detail, including the stored spec that started it and an
        activity timeline.
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/JobRunDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/job/{run_id}/cancel:
    post:
      operationId: cancelJobRun
      tags: [Jobs]
      summary: Cancel a job run
      description: >-
        Requests cancellation rather than forcibly terminating, so the run's
        own cleanup (e.g. deleting a sandbox it created) still executes.
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '204': { description: Cancellation requested }
        default: { $ref: '#/components/responses/Problem' }
  # Schedules: a durable cron, interval, or one-shot trigger for a job. "Run
  # once at this date and time" is a schedule with run_at_unix_nanos set and
  # RemainingActions=1, not a separate mechanism -- see JobScheduleRequest.
  # Member-authenticated like the job surface above.
  /v1/job-schedule:
    parameters:
      - $ref: '#/components/parameters/OrganizationHeader'
    post:
      operationId: createJobSchedule
      tags: [Job Schedules]
      summary: Create a job schedule
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobScheduleRequest' }
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties: { schedule: { $ref: '#/components/schemas/JobSchedule' } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listJobSchedules
      tags: [Job Schedules]
      summary: List job schedules
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1 }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Schedule page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSchedulePage' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/job-schedule/{schedule_id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: getJobSchedule
      tags: [Job Schedules]
      summary: Get a job schedule
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties: { schedule: { $ref: '#/components/schemas/JobSchedule' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateJobSchedule
      tags: [Job Schedules]
      summary: Update a job schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobScheduleRequest' }
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties: { schedule: { $ref: '#/components/schemas/JobSchedule' } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteJobSchedule
      tags: [Job Schedules]
      summary: Delete a job schedule
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /v1/job-schedule/{schedule_id}/pause:
    post:
      operationId: setJobSchedulePaused
      tags: [Job Schedules]
      summary: Pause or resume a job schedule
      parameters:
        - $ref: '#/components/parameters/ScheduleID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: { type: boolean }
                note: { type: string }
      responses:
        '200':
          description: Pause state updated
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties: { schedule: { $ref: '#/components/schemas/JobSchedule' } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/job-schedule/{schedule_id}/trigger:
    post:
      operationId: triggerJobSchedule
      tags: [Job Schedules]
      summary: Trigger a job schedule
      description: Fires one run immediately, overriding the schedule's own timing.
      parameters:
        - $ref: '#/components/parameters/ScheduleID'
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '204': { description: Triggered }
        default: { $ref: '#/components/responses/Problem' }
  # Organization administration is JWT-only throughout -- all seven
  # operations from here to the member sub-resource below, alongside the
  # invitation surface that was already dashboard-only and x-internal.
  #
  # This document originally left every one of them on the root "API key OR
  # JWT" security. That was unflagged drift rather than a recorded decision,
  # and it was wrong twice over: #248's provisioning paragraph names GET and
  # POST /v1/organizations among the five JWT-authenticated operations, and
  # the five sub-resource operations have refused API keys since S16.2
  # shipped the Management posture -- the document was describing behavior
  # the server never had. Corrected in S16.3 (#251); the handlers did not
  # change.
  /v1/organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: List organizations
      description: >
        Organizations the caller belongs to, with their role in each. JWT
        provisioning operation; API keys are refused.
      responses:
        '200':
          description: Organizations for the caller
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOrganization
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: Create an organization
      description: >
        Creates an organization owned by the caller. JWT provisioning
        operation; API keys are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getOrganization
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: Get an organization
      description: Any member may read; a non-member gets 404, never 403.
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOrganization
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: Rename an organization
      description: Owner only. Organization deletion is out of scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/members:
    get:
      operationId: listMembers
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: List members
      description: Any member of the organization may list.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateMember
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: Update a member's role
      description: Owner only. Demoting the final owner returns 409 final_owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeMember
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: Remove a member
      description: >
        Administrative removal (owner only) and member self-leave share this
        verb. Removing the final owner is 409 final_owner, which is also why
        the sole owner of a personal organization cannot leave it.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  # The nested segment is /invites, exactly as the #248 surface table writes
  # it; the acceptance path below is /v1/invitations/accept, also verbatim.
  # The asymmetry is the frozen contract's, not this document's to smooth.
  /v1/organizations/{organization_id}/invites:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listInvites
      x-internal: true
      tags: [Invitations]
      security:
        - supabaseJwt: []
      summary: List invitations
      description: >-
        Dashboard-facing; Supabase JWT required, API keys rejected. Owner
        only.
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createInvite
      x-internal: true
      tags: [Invitations]
      security:
        - supabaseJwt: []
      summary: Create an invitation
      description: >
        Dashboard-facing; owner only. The response carries the raw token
        exactly once and no acceptance URL: the dashboard builds
        .../invitations/accept#token=... itself, because TApi does not know
        the dashboard's origin. A live invitation already addressed to the
        same address is 409 lifecycle_conflict; a personal organization is
        400 validation_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Invitation created; body carries the token once
          content:
            application/json:
              schema:
                type: object
                required: [invitation, token]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  token:
                    type: string
                    description: >
                      Shown exactly once. Belongs in the URL fragment of an
                      invite link, never in a path or query string.
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/invites/{invitation_id}:
    delete:
      operationId: revokeInvite
      x-internal: true
      tags: [Invitations]
      security:
        - supabaseJwt: []
      summary: Revoke an invitation
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - name: invitation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/usage:
    get:
      operationId: getOrganizationUsage
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: Get usage and credit balance
      description: >-
        Owner or billing role. Reports total recorded usage and its current
        settled credit balance; both are unbounded (all usage recorded so
        far), not scoped to a billing period.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Usage and credit standing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationUsageResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/usage/breakdown:
    get:
      operationId: getOrganizationUsageBreakdown
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: Get a usage breakdown
      description: >-
        Owner or billing role. from and to are both required RFC 3339
        timestamps, unlike GET .../usage's all-time default; from must
        precede to. Reports the two supported billable metrics with their
        share of priced usage and each one's heaviest consumer.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Usage breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageBreakdown' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/usage/series:
    get:
      operationId: getOrganizationUsageSeries
      tags: [Organizations]
      security:
        - supabaseJwt: []
      summary: Get a usage time series
      description: >-
        Owner or billing role. from and to are both required; bucket is
        hour or day and defaults to day. Only non-empty buckets are
        returned. estimated_cents is either present on every point or
        absent from every point: one price read prices the whole series.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: bucket
          in: query
          schema: { type: string, enum: [hour, day], default: day }
      responses:
        '200':
          description: Usage series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSeries' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      x-internal: true
      tags: [Invitations]
      security:
        - supabaseJwt: []
      summary: Accept an invitation
      description: >
        Dashboard-facing; the dashboard reads the token from the URL fragment
        and posts it in the body. The invitation must have been issued to the
        authenticated caller's own address, compared case-insensitively; a
        token alone is not enough. A valid acceptance provisions and consumes
        the invite in one transaction; an invalid or replayed one rolls back
        with nothing provisioned. Unknown, addressed-to-someone-else,
        consumed, revoked and expired tokens are one indistinguishable 404,
        and a mismatched attempt leaves the invitation live for its
        recipient. JWT provisioning operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/api-keys:
    get:
      operationId: listApiKeys
      tags: [API Keys]
      security:
        - supabaseJwt: []
      summary: List API keys
      description: >-
        JWT-only; keys can never manage keys. JWT provisioning operation.
      responses:
        '200':
          description: Keys (prefix and last4 only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyListResponse' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createApiKey
      tags: [API Keys]
      security:
        - supabaseJwt: []
      summary: Create an API key
      description: >-
        JWT-only; the secret is shown exactly once. JWT provisioning
        operation.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APIKeyCreateRequest' }
      responses:
        '201':
          description: Key created; body carries the secret once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyCreateResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      tags: [API Keys]
      security:
        - supabaseJwt: []
      summary: Revoke an API key
      description: JWT-only.
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }
  # Device-authorization login (#299): `bonya login` opens a browser instead of
  # asking for a pasted API key. Three legs, none of them carrying the same
  # credential as the others: mint and poll are unauthenticated at the header
  # level because the token itself is the credential (mirroring how
  # acceptInvitation's token works), and approve is JWT-only because it is the
  # already-signed-in browser session vouching for a login it did not start.
  /v1/device-login:
    post:
      operationId: mintDeviceLogin
      tags: [Device Login]
      security: []
      summary: Start a device login
      description: >
        Unauthenticated; mints a single-use device-login token and the
        dashboard URL the CLI opens a browser to. No request body.
      responses:
        '201':
          description: Token minted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceLoginMintResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/device-login/approve:
    post:
      operationId: approveDeviceLogin
      tags: [Device Login]
      security:
        - supabaseJwt: []
      summary: Approve a device login
      description: >-
        JWT-only; approves a CLI device-login token. JWT provisioning
        operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceLoginApproveRequest' }
      responses:
        '204': { description: Approved }
        default: { $ref: '#/components/responses/Problem' }
  /v1/device-login/poll:
    post:
      operationId: pollDeviceLogin
      tags: [Device Login]
      security: []
      summary: Poll a device login
      description: >
        Unauthenticated; the token in the body is the credential. Always 200:
        pending, approved (carries the api_key exactly once), or expired.
        An unknown token is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceLoginApproveRequest' }
      responses:
        '200':
          description: Poll result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceLoginPollResponse' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued session JWT; required for org, invite, and key management.
    personalApiKey:
      type: http
      scheme: bearer
      description: Personal byk_ API key; user-principal, resolved to a tenant by org context.
  parameters:
    TemplateID:
      name: template_id
      in: path
      required: true
      schema: { type: string }
    RegistryConnectionID:
      name: connection_id
      in: path
      required: true
      schema: { type: string }
    SecretID:
      name: secret_id
      in: path
      required: true
      schema: { type: string }
    SecretSetID:
      name: secret_set_id
      in: path
      required: true
      schema: { type: string }
    OrganizationHeader:
      name: X-Bonya-Organization-ID
      in: header
      required: false
      schema: { type: string }
      description: >
        Org context. Omitted means the caller's personal organization. A
        well-formed non-member org is 404; malformed is 400.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
      description: >
        Absent means server-generated, which provides no deduplication; only
        client-supplied keys dedupe.
    SandboxID:
      name: sandbox_id
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    ScheduleID:
      name: schedule_id
      in: path
      required: true
      schema: { type: string }
    PreviewID:
      name: preview_id
      in: path
      required: true
      schema: { type: string, pattern: '^pv-[a-z2-7]{26}$' }
    SessionName:
      name: session_name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema: { type: string }
    FsPath:
      name: path
      in: query
      required: true
      schema: { type: string }
  responses:
    ForkResult:
      description: Fork result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ForkResult' }
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    OrganizationUsageResponse:
      type: object
      required: [usage, credit]
      properties:
        usage:
          type: object
          required: [compute_seconds, storage_hours, members]
          properties:
            compute_seconds: { type: number }
            storage_hours: { type: number }
            members:
              type: array
              items: { $ref: '#/components/schemas/BillingMemberUsage' }
        credit:
          type: object
          description: >-
            The provider's currently settled wallet balance, not the locally
            cached effective verdict the Create path enforces on; the two can
            differ because this balance does not subtract uninvoiced usage.
          required: [balance, blocked]
          properties:
            balance: { type: number }
            blocked: { type: boolean }
    BillingMemberUsage:
      type: object
      description: >-
        One member's share of usage. An empty user id is the unattributed
        bucket -- usage whose opening actor record was lost -- reported as
        unattributed: true rather than an empty user_id, so a consumer cannot
        mistake it for a member whose id failed to render. Exactly one of
        user_id or unattributed is present.
      required: [compute_seconds, storage_hours]
      properties:
        user_id: { type: string }
        unattributed: { type: boolean }
        compute_seconds: { type: number }
        storage_hours: { type: number }
    UsageSeries:
      type: object
      required: [currency, period, bucket, points, degraded]
      properties:
        currency: { type: string }
        period: { $ref: '#/components/schemas/BillingPeriod' }
        bucket: { type: string, enum: [hour, day] }
        points:
          type: array
          description: Only non-empty buckets are included.
          items: { $ref: '#/components/schemas/UsageSeriesPoint' }
        degraded:
          type: array
          items: { $ref: '#/components/schemas/Degradation' }
    Degradation:
      type: string
      enum: [balance, prices, limits, offers]
      description: >-
        One provider-dependent enrichment that was attempted and did not
        produce a usable value. Never emitted for a value that is
        legitimately absent.
    UsageSeriesPoint:
      type: object
      required: [from, to, compute_seconds, storage_hours]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        compute_seconds: { type: number }
        storage_hours: { type: number }
        estimated_cents:
          type: integer
          format: int64
          description: >-
            Present on every point or absent from every point: one price
            read prices the whole series.
    BillingPeriod:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    UsageBreakdown:
      type: object
      required: [currency, period, services, members, degraded]
      properties:
        currency: { type: string }
        period: { $ref: '#/components/schemas/BillingPeriod' }
        services:
          type: array
          items: { $ref: '#/components/schemas/BillingServiceUsage' }
        members:
          type: array
          items: { $ref: '#/components/schemas/BillingMemberUsage' }
        degraded:
          type: array
          items: { $ref: '#/components/schemas/Degradation' }
    BillingServiceUsage:
      type: object
      required: [metric_code, unit, units]
      properties:
        metric_code: { type: string, enum: [nest_compute_seconds, nest_storage_hours] }
        unit: { type: string }
        units: { type: number }
        estimated_cents:
          type: integer
          format: int64
          description: Present only together with share, when prices were read successfully.
        share:
          type: number
          description: >-
            Has no meaning without a price: it compares metrics measured in
            different units, so money is the only common unit and there is
            no unpriced fallback.
        heaviest:
          type: object
          description: Absent when the metric has no recorded usage at all.
          required: [units]
          properties:
            user_id: { type: string }
            unattributed: { type: boolean }
            units: { type: number }
    TemplateConfig:
      type: object
      additionalProperties: false
      description: Launch configuration. Contains secret references, never values.
      properties:
        image: { type: string, description: OCI image reference. }
        image_digest: { type: string, description: Resolved by the service on save. }
        registry_connection_id: { type: string }
        cpu: { type: integer }
        memory_mib: { type: integer }
        disk_gib: { type: integer }
        disk_bytes: { type: integer }
        env:
          type: object
          additionalProperties: { type: string }
        secret_bindings:
          type: object
          additionalProperties: { type: string }
          description: Environment variable name to secret id.
        secret_sets:
          type: array
          items: { type: string }
          description: Secret set names (see /v1/secret-sets).
        secret_set_revisions:
          type: array
          readOnly: true
          description: Pinned by the service on save.
          items:
            type: object
            properties:
              id: { type: string }
              revision: { type: integer }
        entrypoint:
          type: [array, 'null']
          items: { type: string }
          description: Null inherits the image default; an array overrides it.
        command:
          type: [array, 'null']
          items: { type: string }
        working_dir: { type: string }
        network: { $ref: '#/components/schemas/NetworkPolicy' }
        previews:
          type: array
          items:
            type: object
            properties:
              port: { type: integer }
              visibility: { type: string }
    Template:
      type: object
      required: [id, organization_id, name, revision, config, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
        revision: { type: integer, description: Increases with each published configuration. }
        config: { $ref: '#/components/schemas/TemplateConfig' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TemplateWrite:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        config: { $ref: '#/components/schemas/TemplateConfig' }
        revision:
          type: integer
          description: Expected current revision, to guard against concurrent edits.
    RegistryConnection:
      type: object
      required: [id, organization_id, name, registry, username, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        registry: { type: string }
        username: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegistryConnectionWrite:
      type: object
      additionalProperties: false
      required: [name, registry, username, password]
      properties:
        name: { type: string }
        registry: { type: string }
        username: { type: string }
        password: { type: string, writeOnly: true }
    Secret:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretWrite:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string, writeOnly: true }
    SecretSet:
      type: object
      required: [id, organization_id, name, revision, keys, environment_bytes, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        revision: { type: integer }
        keys:
          type: array
          items: { type: string }
        environment_bytes: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretSetWrite:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        values:
          type: object
          writeOnly: true
          additionalProperties: { type: string }
        revision:
          type: integer
          description: Expected current revision, to guard against concurrent edits.
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
    SandboxState:
      type: string
      enum: [creating, running, warm, cooling, cold, waking, deleting, deleted, failed, lost]
    ImageRef:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
        digest: { type: string }
    GpuRequest:
      type: object
      required: [type, count]
      properties:
        type: { type: string }
        count: { type: integer, minimum: 1 }
    Sandbox:
      type: object
      required: [id, name, organization_id, template_version, state, generation, vcpus, memory_mib, user_layer_bytes, created_at, network, network_revision, network_applied_revision]
      properties:
        id: { type: string, description: 'Sandbox id, for example sb-bpyk22c3ei3hfx.' }
        name: { type: string }
        organization_id: { type: string }
        template_version: { type: string }
        state: { $ref: '#/components/schemas/SandboxState' }
        generation: { type: integer }
        vcpus: { type: integer }
        memory_mib: { type: integer }
        user_layer_bytes: { type: integer }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
        parent_snapshot_id: { type: string, description: The named snapshot it was created from. }
        forked_from_sandbox_id: { type: string }
        pause_source: { type: string, description: 'Who paused it: idle, requested, memory_pressure.' }
        network: { $ref: '#/components/schemas/NetworkPolicy' }
        network_revision: { type: integer }
        network_applied_revision:
          type: integer
          description: Revision the node is known to enforce; below network_revision until a change is applied.
        image: { $ref: '#/components/schemas/ImageRef' }
        gpu: { $ref: '#/components/schemas/GpuRequest' }
        exec_capability_jws:
          type: string
          description: Exec capability token, present on responses that carry one.
    SandboxPage:
      type: object
      required: [sandboxes, next_page_token]
      properties:
        sandboxes:
          type: array
          items: { $ref: '#/components/schemas/Sandbox' }
        next_page_token: { type: string }
    SandboxCreate:
      type: object
      additionalProperties: false
      properties:
        template_id:
          type: string
          description: >-
            Omit to use the deployment's configured default template.
        template_revision: { type: integer }
        template_version: { type: string }
        snapshot: { type: string, description: Snapshot id to start from. }
        image: { type: string, description: OCI image reference. }
        gpu:
          allOf:
            - $ref: '#/components/schemas/GpuRequest'
          description: >-
            Requests a GPU sandbox. Requires image (or an image template);
            cannot be combined with snapshot or template_version. Valid
            type/count pairs come from GET /v1/sandbox/gpu-options, which is
            empty when no GPU capacity is configured. Subject to the
            organization's concurrent-GPU limit.
        network: { $ref: '#/components/schemas/NetworkPolicy' }
        env:
          type: object
          additionalProperties: { type: string }
        secret_sets:
          type: array
          items: { type: string }
          description: Secret set names (see /v1/secret-sets).
        # Optional display label. Blank or omitted means the service generates
        # a friendly one. Names are not unique and address nothing: every
        # lookup is by sandbox id.
        name: { type: string, maxLength: 80 }
    NetworkPolicy:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [open, allowlist, airgap]
          default: open
          description: open is unrestricted egress; allowlist allows only the listed destinations; airgap has no network.
        allow:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/NetworkRule' }
      allOf:
        - if:
            properties: { mode: { const: allowlist } }
          then:
            required: [allow]
            properties: { allow: { minItems: 1 } }
          else:
            properties: { allow: { maxItems: 0 } }
    NetworkRule:
      type: object
      additionalProperties: false
      description: Exactly one of domain or cidr. Per-rule ports are not supported yet.
      properties:
        domain: { type: string, description: 'A DNS name such as pypi.org or *.pythonhosted.org.' }
        cidr: { type: string }
    Snapshot:
      type: object
      required: [id, organization_id, sandbox_id, kind, name, state, template_version, created_at]
      properties:
        id: { type: string, description: 'Snapshot id, for example snp-s63fo7ewzqc2al.' }
        organization_id: { type: string }
        sandbox_id: { type: string }
        kind: { type: string, enum: [named] }
        name: { type: string }
        state: { type: string, description: 'For example published or deleted.' }
        template_version: { type: string }
        manifest_digest: { type: string }
        file_bytes: { type: integer }
        stored_bytes: { type: integer }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
        image: { $ref: '#/components/schemas/ImageRef' }
    ForkResult:
      type: object
      required: [sandbox_id, from_warm, sandboxes]
      properties:
        sandbox_id: { type: string, description: The source sandbox. }
        from_warm: { type: boolean }
        sandboxes:
          type: array
          items: { $ref: '#/components/schemas/Sandbox' }
    PreviewAuthMode:
      type: string
      enum: [private, public]
      default: private
      description: >
        private requires a grant token, exchanged once at the grant's
        exchange_url for a host-scoped cookie; public needs no token.
    Preview:
      type: object
      required: [id, sandbox_id, port, auth, url, created_by_user_id, created_at]
      properties:
        id: { type: string, description: 'Preview id, for example pv-e7otwsh2azaf2yzffkqlfcxyya.' }
        sandbox_id: { type: string }
        port: { type: integer }
        auth: { $ref: '#/components/schemas/PreviewAuthMode' }
        url: { type: string, format: uri, description: Token-free preview URL. }
        created_by_user_id: { type: string }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    PreviewGrant:
      type: object
      required: [id, preview_id, created_at, expires_at]
      properties:
        id: { type: string }
        preview_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        token: { type: string, description: Returned only when the grant is created. }
        exchange_url: { type: string, description: Returned only when the grant is created. }
    PreviewGrantRequest:
      type: object
      additionalProperties: false
      properties:
        ttl_seconds: { type: integer, minimum: 0, maximum: 31536000 }
    PreviewCreateRequest:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        port: { type: integer }
        auth: { $ref: '#/components/schemas/PreviewAuthMode' }
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 31536000
          description: Lifetime of the first grant of a private preview.
    PreviewCreateResponse:
      allOf:
        - $ref: '#/components/schemas/Preview'
        - type: object
          properties:
            grant:
              $ref: '#/components/schemas/PreviewGrant'
    PreviewListResponse:
      type: object
      required: [previews]
      properties:
        previews:
          type: array
          items: { $ref: '#/components/schemas/Preview' }
    Role:
      type: string
      enum: [owner, member, billing]
      default: member
      description: >-
        Custom roles are out of scope; the set is closed. billing is a
        restricted role that cannot manage members, invitations, or
        organization settings.
    Organization:
      type: object
      required: [organization_id, name, personal, created_at]
      properties:
        organization_id: { type: string, pattern: '^org-[0-9a-f]{32}$' }
        name: { type: string, maxLength: 128 }
        personal:
          type: boolean
          description: >
            True for the caller's personal organization, the deterministic
            tenant an omitted org context resolves to. Personal
            organizations cannot be invited into.
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: The requesting caller's role, when known.
        created_at: { type: string, format: date-time }
    OrganizationWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
    Member:
      type: object
      required: [user_id, email, role, joined_at]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [invitation_id, organization_id, email, role, invited_by_user_id, status, created_at, expires_at]
      properties:
        invitation_id: { type: string }
        organization_id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        invited_by_user_id: { type: string }
        status:
          type: string
          enum: [live, expired, consumed, revoked]
          description: >
            Derived lifecycle. Consumed and revoked outrank expiry, so an
            invitation that was used and later passed its expiry reads
            consumed.
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        consumed_at: { type: string, format: date-time }
        consumed_by_user_id: { type: string }
        revoked_at: { type: string, format: date-time }
    APIKey:
      type: object
      required: [key_id, display_prefix, display_last4, created_at]
      properties:
        key_id: { type: string }
        name: { type: string, maxLength: 128 }
        display_prefix: { type: string }
        display_last4: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    APIKeyListResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items: { $ref: '#/components/schemas/APIKey' }
    APIKeyCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 128 }
    APIKeyCreateResponse:
      type: object
      required: [api_key, secret]
      properties:
        api_key: { $ref: '#/components/schemas/APIKey' }
        secret:
          type: string
          description: Shown exactly once. Store it as a user-principal API key.
    DeviceLoginMintResponse:
      type: object
      required: [token, verification_url, expires_in, interval]
      properties:
        token: { type: string, description: The byd_ device-login token; also embedded in verification_url. }
        verification_url: { type: string, description: Dashboard URL the caller opens a browser to. }
        expires_in: { type: integer, description: Seconds until the token expires unapproved. }
        interval: { type: integer, description: Recommended seconds between poll calls. }
    DeviceLoginApproveRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: The byd_ device-login token from the verification URL. }
    DeviceLoginPollResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, expired] }
        api_key:
          type: string
          description: Present only once, on the single poll that observes "approved".
        user_email:
          type: string
          description: The approving user's email; present alongside api_key.
    CommandSpec:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items: { type: string }
          minItems: 1
        env:
          type: object
          additionalProperties: { type: string }
        working_dir: { type: string }
    DirectExecRequest:
      allOf:
        - $ref: '#/components/schemas/CommandSpec'
        - type: object
          properties:
            timeout_ms: { type: integer, minimum: 1 }
            stdin_b64: { type: string, contentEncoding: base64 }
            output_encoding: { type: string, enum: [utf8, base64] }
    DirectExecResponse:
      type: object
      required: [exit_code, stdout, stderr, took_ms, output_encoding]
      properties:
        exit_code: { type: integer }
        signaled: { type: boolean }
        signal: { type: integer }
        took_ms: { type: number }
        stdout: { type: string }
        stderr: { type: string }
        stdout_truncated: { type: boolean }
        stderr_truncated: { type: boolean }
        output_encoding: { type: string, enum: [utf8, base64] }
    SessionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/CommandSpec'
        - type: object
          required: [name]
          properties:
            name: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
            cols: { type: integer, minimum: 1, maximum: 512 }
            rows: { type: integer, minimum: 1, maximum: 512 }
            replace: { type: boolean, default: false }
    SessionKillRequest:
      type: object
      properties:
        signal: { type: string, enum: [TERM, KILL, INT, HUP], default: TERM }
        grace_ms: { type: integer, minimum: 0, maximum: 60000, default: 5000 }
    SessionExit:
      type: object
      required: [exit_code, signaled, signal]
      properties:
        exit_code: { type: integer }
        signaled: { type: boolean }
        signal: { type: integer }
    SessionInfo:
      type: object
      required: [name, command, working_dir, status, attached, started_at_unix_nanos, last_activity_unix_nanos]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
        command:
          type: array
          items: { type: string }
        working_dir: { type: string }
        status: { type: string, enum: [unspecified, starting, idle, attached, exited, killed, failed] }
        attached: { type: boolean }
        started_at_unix_nanos: { type: integer }
        last_activity_unix_nanos: { type: integer }
        ended_at_unix_nanos: { type: integer }
        exit: { $ref: '#/components/schemas/SessionExit' }
    SessionResponse:
      type: object
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/SessionInfo' }
    SessionListResponse:
      type: object
      required: [sessions, sandbox_suspended]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionInfo' }
        sandbox_suspended:
          type: boolean
    FsFileInfo:
      type: object
      required: [path, name, kind, size, mode, modified_at_unix_nanos]
      properties:
        path: { type: string }
        name: { type: string }
        kind: { type: string, enum: [UNSPECIFIED, FILE, DIRECTORY, SYMLINK, OTHER] }
        size: { type: integer, minimum: 0 }
        mode:
          type: integer
          minimum: 0
          maximum: 4095
          description: Permission bits as reported by the guest.
        modified_at_unix_nanos: { type: integer }
    FsListResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/FsFileInfo' }
    FsStatResponse:
      type: object
      required: [file]
      properties:
        file: { $ref: '#/components/schemas/FsFileInfo' }
    FsMkdirRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
    FsRenameRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    JobRequest:
      type: object
      description: >-
        Exactly one of existing_sandbox_id and new_sandbox is required.
        Exactly one of command and script is required.
      properties:
        name:
          type: string
          description: Optional human-readable name for this job.
        existing_sandbox_id: { type: string }
        new_sandbox: { $ref: '#/components/schemas/JobNewSandboxSpec' }
        command:
          type: array
          items: { type: string }
        script: { $ref: '#/components/schemas/JobScriptSpec' }
        pre_run_script:
          allOf:
            - $ref: '#/components/schemas/JobScriptSpec'
          description: >-
            Optional script executed after the sandbox is ready and before the
            job command or script. A non-zero exit stops the job.
        env:
          type: object
          additionalProperties: { type: string }
        secret_sets:
          type: array
          items: { type: string }
          description: Secret set names (see /v1/secret-sets).
        working_dir: { type: string }
        stdin_b64: { type: string, contentEncoding: base64 }
        command_timeout_seconds: { type: integer, minimum: 1 }
        run_deadline_seconds: { type: integer, minimum: 1 }
        disposition:
          type: string
          enum: [delete, keep]
          default: delete
          description: >-
            What happens to a sandbox this run created when the run ends,
            however it ends. Not meaningful for an existing sandbox.
        wake_if_paused:
          type: boolean
          default: false
          description: >-
            Applies to an existing sandbox only. False makes a paused
            target a failure rather than an implicit wake, which is a
            billable action the caller may not have intended.
        wait:
          type: boolean
          default: false
          description: >-
            false starts durably and returns immediately (202); true blocks
            for the result, bounded by the caller's own request timeout (200).
    JobNewSandboxSpec:
      type: object
      properties:
        template_id:
          type: string
          description: Omit to use the deployment's configured default template.
        template_revision: { type: integer }
        snapshot: { type: string }
        image: { type: string }
        name: { type: string }
        network: { $ref: '#/components/schemas/NetworkPolicy' }
        env:
          type: object
          additionalProperties: { type: string }
        secret_sets:
          type: array
          items: { type: string }
    JobScriptSpec:
      type: object
      required: [body]
      description: >-
        A script the user wrote or uploaded. The body travels inline and is
        capped; a script larger than the cap is a program, and a program
        belongs in the template or fetched by the script itself.
      properties:
        body: { type: string, description: The script source text. }
        interpreter: { type: string, default: sh }
        args:
          type: array
          items: { type: string }
        filename: { type: string }
    JobStartResponse:
      type: object
      required: [run_id, already_running]
      properties:
        run_id: { type: string }
        already_running:
          type: boolean
          description: >-
            True when this call joined an existing run rather than starting
            one, which is what a retried request with the same
            Idempotency-Key does.
    JobResult:
      type: object
      required: [exit_code, signaled, timed_out, stdout_b64, stderr_b64, stdout_truncated, stderr_truncated]
      description: >-
        The command's outcome. A non-zero exit_code is a completed run, not a
        failed one; a failure to create or resume the sandbox is a failed run
        instead, reported via the run's own failure field.
      properties:
        exit_code: { type: integer }
        signaled: { type: boolean }
        signal: { type: integer }
        timed_out: { type: boolean }
        stdout_b64: { type: string, contentEncoding: base64 }
        stderr_b64: { type: string, contentEncoding: base64 }
        stdout_truncated: { type: boolean }
        stderr_truncated: { type: boolean }
    JobRun:
      type: object
      required: [run_id, status, created_sandbox, cleanup_failed, available_actions]
      properties:
        run_id: { type: string }
        name:
          type: string
          description: Optional human-readable name for this job.
        status:
          type: string
          enum: [running, completed, failed, canceled, timed_out, terminated]
        sandbox_id: { type: string }
        created_sandbox:
          type: boolean
          description: >-
            Distinguishes whether this run created sandbox_id or was given
            it, which decides whether the caller still owns it after the run.
        schedule_id: { type: string }
        started_at_unix_nanos: { type: integer }
        finished_at_unix_nanos: { type: integer }
        result: { $ref: '#/components/schemas/JobResult' }
        failure: { type: string }
        cleanup_failed:
          type: boolean
          description: >-
            The run finished but could not delete the sandbox it created.
            That sandbox is still billed and still visible in ListSandboxes.
        available_actions:
          type: array
          description: >-
            What the caller may do to this run right now, computed
            server-side. A client must not re-derive these from status alone.
          items:
            type: string
            enum: [cancel, rerun, retry, delete, delete_sandbox]
    JobRunTimelineEntry:
      type: object
      required: [name]
      description: >-
        One activity attempt, decoded from the workflow engine's own event
        history. Nothing here is stored by this module; it stops existing
        once the namespace's retention window passes.
      properties:
        name: { type: string }
        attempt: { type: integer }
        started_at_unix_nanos: { type: integer }
        finished_at_unix_nanos: { type: integer }
        failure: { type: string }
    JobRunDetail:
      allOf:
        - $ref: '#/components/schemas/JobRun'
        - type: object
          properties:
            job: { $ref: '#/components/schemas/JobRequest' }
            timeline:
              type: array
              items: { $ref: '#/components/schemas/JobRunTimelineEntry' }
    JobRunPage:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/JobRun' }
        next_page_token: { type: string }
    JobScheduleRequest:
      type: object
      required: [job]
      description: >-
        Exactly one of cron_expressions, interval_s, and run_at_unix_nanos is
        required.
      properties:
        cron_expressions:
          type: array
          items: { type: string }
        interval_s: { type: integer, minimum: 1 }
        run_at_unix_nanos:
          type: integer
          description: "One-shot: a single future calendar time. Refused if in the past."
        time_zone: { type: string, description: "IANA zone, e.g. US/Pacific. Empty is UTC." }
        jitter_s: { type: integer, minimum: 0 }
        overlap:
          type: string
          enum: [skip, buffer_one, allow_all]
          default: skip
          description: >-
            What a fire does when the previous run is still going. skip (the
            default) drops the new fire.
        paused: { type: boolean, default: false }
        job: { $ref: '#/components/schemas/JobRequest' }
    JobSchedule:
      type: object
      required: [schedule_id, paused, one_shot, available_actions]
      properties:
        schedule_id: { type: string }
        schedule:
          type: object
          properties:
            cron_expressions:
              type: array
              items: { type: string }
            interval_s: { type: integer }
            run_at_unix_nanos: { type: integer }
            time_zone: { type: string }
            jitter_s: { type: integer }
            overlap: { type: string, enum: [skip, buffer_one, allow_all] }
        job: { $ref: '#/components/schemas/JobRequest' }
        paused: { type: boolean }
        note: { type: string }
        next_run_at_unix_nanos: { type: integer }
        one_shot:
          type: boolean
          description: True when this schedule fires exactly once (run_at_unix_nanos).
        remaining_actions:
          type: integer
          description: Present for one-shot schedules; 0 once spent.
        available_actions:
          type: array
          items:
            type: string
            enum: [pause, resume, trigger, update, delete]
        created_at_unix_nanos:
          type: integer
          description: >-
            When this schedule was created. This deployment keeps no
            schedule state of its own; this is exactly what the workflow
            engine reports.
        updated_at_unix_nanos:
          type: integer
          description: When this schedule was last paused, resumed, or edited.
        num_actions:
          type: integer
          description: How many times this schedule has fired, including manual triggers.
        num_actions_skipped_overlap:
          type: integer
          description: >-
            Fires dropped because the previous run was still going. Relevant
            when overlap is skip, the default.
        num_actions_missed_catchup_window:
          type: integer
          description: >-
            Fires dropped because the server was down or behind past its
            catchup window. A schedule that looks paused but is not may show
            up here instead.
        recent_run_ids:
          type: array
          items: { type: string }
          description: >-
            The last 10 fires' run ids, oldest first, including manual
            triggers. Each is a valid GET /v1/job/{run_id} id, so a caller
            can follow one without a separate GET /v1/job?schedule_id=...
            call.
        running_run_ids:
          type: array
          items: { type: string }
          description: >-
            Which of this schedule's own fires are in flight right now.
            Non-empty only under an overlap policy that allows more than one
            run at a time; skip, the default, keeps this to at most one.
    JobSchedulePage:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items: { $ref: '#/components/schemas/JobSchedule' }
        next_page_token: { type: string }
